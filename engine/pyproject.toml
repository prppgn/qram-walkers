[project]
name = "qramsim"
version = "0.1.0"
description = "Simulation engine of the quantum-walker quantum RAM (arXiv:2508.02855)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "qram-walkers contributors" }]
dependencies = [
    "fastapi>=0.110",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# The interface in a window of its own (macOS, Windows); Linux opens the browser instead.
desktop = ["pywebview>=5.3; sys_platform == 'darwin' or sys_platform == 'win32'"]

[project.scripts]
qramsim = "qramsim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]
# Building the installers (packaging/build.py).
bundle = ["pyinstaller>=6.10", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qramsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N"]
# The paper's notation (∅, ⟩, Û, ...) appears throughout strings and comments; the
# mathematical names X, S, K, T_fwd and the branch index l follow the paper.
ignore = ["RUF001", "RUF002", "RUF003", "N802", "N803", "N806", "N815", "N816", "N818", "E741"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/qramsim"]

[[tool.mypy.overrides]]
module = ["numpy.*", "webview", "webview.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["qramsim"]
known-local-folder = ["helpers"]
